// ================= 地形の高さ計算 =================
const BASE_Y = 440; // 標高0の地面Y
let courseIdx = 0, course = COURSES[0], elevPoints = [];

function buildElev() {
  const pts = [{ x: -2000, e: 0 }, { x: 0, e: 0 }];
  let x = 0, e = 0;
  for (const [len, de] of course.segments) {
    x += len; e += de;
    pts.push({ x, e });
  }
  if (x < CONF.courseLength) { x = CONF.courseLength; pts.push({ x, e }); } // 残りは平地
  pts.push({ x: x + 5000, e });
  elevPoints = pts;
}

// コースを切り替えてタイトル画面へ
function setCourse(i) {
  courseIdx = (i + COURSES.length) % COURSES.length;
  course = COURSES[courseIdx];
  buildElev();
  bestTimes = loadBest();
  reset();
  document.querySelector("h1").textContent = `⛰ トレイルランニング — コース${courseIdx + 1}「${course.name}」`;
}

function elevation(wx) {
  for (let i = 1; i < elevPoints.length; i++) {
    if (wx <= elevPoints[i].x) {
      const a = elevPoints[i - 1], b = elevPoints[i];
      const t = (wx - a.x) / (b.x - a.x);
      return a.e + (b.e - a.e) * t;
    }
  }
  return elevPoints[elevPoints.length - 1].e;
}
function groundY(wx) { return BASE_Y - elevation(wx); }
// 勾配: 正=上り、負=下り
function slopeAt(wx) { return (elevation(wx + 12) - elevation(wx - 12)) / 24; }

// ================= ベストタイム記録（ベスト5） =================
function bestKey() { return "trailrun_best_course" + (courseIdx + 1); } // コース別に記録
function loadBest() {
  try {
    const v = JSON.parse(localStorage.getItem(bestKey()));
    if (Array.isArray(v)) return v.filter((n) => typeof n === "number").slice(0, 5);
  } catch (e) { /* localStorageが使えない環境では記録なし扱い */ }
  return [];
}
function saveBest(list) {
  try { localStorage.setItem(bestKey(), JSON.stringify(list)); } catch (e) {}
}
let bestTimes = [];
// ゴールタイムを記録し、ベスト5内なら順位(0始まり)を、圏外なら-1を返す
function recordTime(t) {
  const list = [...bestTimes, t].sort((a, b) => a - b).slice(0, 5);
  const rank = list.indexOf(t);
  bestTimes = list;
  saveBest(list);
  return rank;
}
function formatTime(t) {
  const m = Math.floor(t / 60);
  const s = t - m * 60;
  return `${m}:${s.toFixed(1).padStart(4, "0")}`;
}

    vy: 0,
    onGround: true,
    inventory: { candy: 2, banana: 2, drink: 0, onigiri: 0 },
    selected: 0,         // FOODSのindex
    time: 0,
    flash: 0,            // 被ダメ時の画面フラッシュ
    messages: [],        // {text, timer, color}
    hazardsHit: new Set(),
    pickupsTaken: new Set(),
    eatCooldown: 0,
    legPhase: 0,
    resultRank: -1,      // ゴール時のベスト5順位（0始まり、圏外は-1）
    camY: 360 - groundY(0), // 縦方向カメラオフセット（プレーヤーを画面高さ360付近に保つ）
    boulders: [],        // 転がってくる落石
    rockfallsFired: new Set(),
    invulnBee: 0,        // 蜂に刺された後の無敵時間
  };
}
setCourse(0);

function addMsg(text, color = "#ffffff") {
  state.messages.push({ text, timer: 1.6, color });
  if (state.messages.length > 4) state.messages.shift();
}

// ================= 入力 =================
const keys = {};
window.addEventListener("keydown", (e) => {
  if (["Space", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.code)) e.preventDefault();
  if (keys[e.code]) return;
  keys[e.code] = true;

  if (state.phase === "title" && (e.code === "Space" || e.code === "Enter")) {
    state.phase = "run";
    return;
  }
  if (state.phase === "title") {
    if (e.code === "ArrowLeft")  { setCourse(courseIdx - 1); return; }
    if (e.code === "ArrowRight") { setCourse(courseIdx + 1); return; }
    const n = ["Digit1", "Digit2", "Digit3", "Digit4", "Digit5"].indexOf(e.code);
    if (n >= 0 && n < COURSES.length) { setCourse(n); return; }
  }
  if (e.code === "KeyR") { reset(); state.phase = "run"; return; }
  if (e.code === "KeyT") { setCourse(courseIdx); return; } // タイトル（コース選択）へ
  if (state.phase !== "run") return;

  if (e.code === "Space" && state.onGround) {
    state.vy = CONF.jumpVel;
    state.onGround = false;
  }
  if (e.code === "ArrowLeft")  state.selected = (state.selected + FOODS.length - 1) % FOODS.length;
  if (e.code === "ArrowRight") state.selected = (state.selected + 1) % FOODS.length;
  if (e.code === "Digit1") state.selected = 0;
  if (e.code === "Digit2") state.selected = 1;
  if (e.code === "Digit3") state.selected = 2;
  if (e.code === "Digit4") state.selected = 3;
  if (e.code === "KeyE") eatSelected();
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function eatSelected() {
  if (state.eatCooldown > 0) return;
  const food = FOODS[state.selected];
  if (state.inventory[food.id] <= 0) {
    addMsg(`${food.name} を持っていない！`, "#ff9090");
    return;
  }
  state.inventory[food.id]--;
  const before = state.hp;
  state.hp = Math.min(state.hpCap, state.hp + food.heal);
  const healed = Math.round(state.hp - before);
  state.eatCooldown = CONF.eatCooldown;
  if (state.hp >= state.hpCap - 0.01 && state.hpCap < CONF.hpMax) {
    addMsg(`${food.name} +${healed}（疲労でこれ以上回復しない…）`, "#ffcf6b");
  } else {
    addMsg(`${food.name} で回復 +${healed}`, "#8bff9e");
  }
}

// ================= 更新 =================
function effectiveMaxSpeed() {
  if (state.hp >= CONF.tiredThreshold) return CONF.maxSpeed;
  const t = state.hp / CONF.tiredThreshold; // 0..1
  return CONF.tiredMinMaxSpeed + (CONF.maxSpeed - CONF.tiredMinMaxSpeed) * t;
}

// 泥道の中か（接地判定は呼び出し側）
function inMudZone() {
  return course.muds.some((z) => state.worldX > z.x && state.worldX < z.x + z.w);
}
// 強風ゾーン内で突風が吹いている最中か
function inWindGust() {
  for (let i = 0; i < course.winds.length; i++) {
    const z = course.winds[i];
    if (state.worldX > z.x && state.worldX < z.x + z.w
        && ((state.time + i * 1.7) % WIND.cycle) < WIND.gustLen) return true;
  }
  return false;
}
// 補給食の現在位置（飴・バナナはその場で上下に揺れ、ドリンク・おにぎりは円軌道で回る）
function pickupPos(p, i) {
  const o = ORBIT[p.kind];
  if (o) {
    const a = state.time * o.w + i * 1.7;
    return { x: p.x + Math.cos(a) * o.r, y: groundY(p.x) - o.cy + Math.sin(a) * o.r };
  }
  return { x: p.x, y: groundY(p.x) - 95 + Math.sin(state.time * 3 + i) * 5 };
}

// 蜂の現在位置（上下に往復）
function beePosition(b) {
  return {
    x: b.x,
    y: groundY(b.x) - b.base - b.amp * Math.sin(state.time * Math.PI * 2 / b.period + b.phase),
  };
}

function scrollSpeed() {
  const t = (state.speed - CONF.minSpeed) / (CONF.maxSpeed - CONF.minSpeed);
  return CONF.scrollMin + (CONF.scrollMax - CONF.scrollMin) * t;
}

function update(dt) {
  if (state.phase !== "run") return;
  state.time += dt;
  state.eatCooldown = Math.max(0, state.eatCooldown - dt);
  state.flash = Math.max(0, state.flash - dt * 2);
  for (const m of state.messages) m.timer -= dt;
  state.messages = state.messages.filter((m) => m.timer > 0);

  // --- 地形の勾配（スピード上昇率と体力消費の両方で使う） ---
  const slope = slopeAt(state.worldX);
  let slopeT = 0, downT = 0; // 登り/下りの急さ 0..1
  if (slope > 0.01)       slopeT = Math.min(1, slope / 0.25);
  else if (slope < -0.01) downT  = Math.min(1, -slope / 0.25);

  // --- スピードゲージ（登りでは上がりにくく、下りでは軽く上がる） ---
  const boosting = keys["ShiftLeft"] || keys["ShiftRight"];
  if (boosting) {
    const rise = slopeT > 0
      ? CONF.speedRiseFlat + (CONF.speedRiseUphill - CONF.speedRiseFlat) * slopeT
      : CONF.speedRiseFlat + (CONF.speedRiseDown - CONF.speedRiseFlat) * downT;
    state.speed += CONF.speedUpRate * rise * dt;
  } else {
    state.speed -= CONF.speedDownRate * dt;
  }
  // 登りでは勾配に応じた維持可能上限まで急減速（Shiftを押していれば上限までは維持できる）
  if (slopeT > 0) {
    const cap = CONF.maxSpeed - (CONF.maxSpeed - CONF.uphillSpeedCap) * slopeT;
    if (state.speed > cap) state.speed = Math.max(cap, state.speed - CONF.uphillDecel * slopeT * dt);
  }
  const maxSp = effectiveMaxSpeed();
  state.speed = Math.max(CONF.minSpeed, Math.min(maxSp, state.speed));
  const mudded = state.onGround && inMudZone();
  if (mudded) state.speed = Math.min(state.speed, MUD.maxSpeed); // 泥道では走れない

  // --- 前進（強風の突風中は進みにくい） ---
  const windActive = inWindGust();
  let sc = scrollSpeed() * dt * 60;
  if (windActive) sc *= WIND.speedFactor;
  state.worldX += sc;
  state.legPhase += sc * 0.09;

  // --- ジャンプ・接地 ---
  const gy = groundY(state.worldX);
  if (state.onGround) {
    state.py = gy;
  } else {
    state.vy += CONF.gravity * dt * 60;
    state.py += state.vy * dt * 60;
    if (state.py >= gy) { state.py = gy; state.vy = 0; state.onGround = true; }
  }

  // --- 体力消費（速度 × 地形） ---
  let terrainFactor = 1.0;
  if (slopeT > 0)     terrainFactor = 1.0 + (CONF.slopeUphill - 1.0) * slopeT;
  else if (downT > 0) terrainFactor = 1.0 - (1.0 - CONF.slopeDownhill) * downT;
  // 歩行（最低スピード）でも基礎消費分は僅かに減る
  const spT = (state.speed - CONF.minSpeed) / (CONF.maxSpeed - CONF.minSpeed); // 0=歩行, 1=全力
  const runCost = spT * spT * CONF.drainSprint * terrainFactor
    * (1 + slopeT * CONF.uphillRunExtra) // 登りで走ると勾配に応じた大きな追加ペナルティ
    + spT * slopeT * CONF.uphillRunLinear; // さらに登りで速度を出すこと自体が高くつく
  let drain = CONF.drainBase * terrainFactor + runCost;
  if (mudded) drain += MUD.drain;       // 泥に足を取られる
  if (windActive) drain += WIND.drain;  // 向かい風に逆らう
  state.hp -= drain * dt;
  state.lastDrain = drain; // オーバーペース警告用

  // --- カメラの縦追従（山の高低差に合わせてゆっくり追う） ---
  const camTarget = 360 - state.py;
  state.camY += (camTarget - state.camY) * Math.min(1, dt * 4);

  // --- 疲労による回復上限の低下 ---
  if (state.hp < CONF.capDropBelow) {
    state.hpCap = Math.max(CONF.capMin, state.hpCap - CONF.capDropRate * dt);
  }

  // --- 障害物との衝突（接地したまま突っ込むとダメージ） ---
  for (let i = 0; i < course.hazards.length; i++) {
    if (state.hazardsHit.has(i)) continue;
    const hz = course.hazards[i];
    const def = HAZARD[hz.type];
    if (state.worldX > hz.x - def.margin && state.worldX < hz.x + def.w + def.margin) {
      const clearance = groundY(state.worldX) - state.py; // 地面からの高さ
      if (state.onGround || clearance < def.clear) {
        state.hazardsHit.add(i);
        state.hp -= def.dmg;
        state.speed = Math.max(CONF.minSpeed, state.speed * 0.4);
        state.flash = 1;
        addMsg(`${def.name} にぶつかった！ -${def.dmg}`, "#ff7070");
      }
    }
  }

  // --- アイテム取得 ---
  for (let i = 0; i < course.pickups.length; i++) {
    if (state.pickupsTaken.has(i)) continue;
    const p = course.pickups[i];
    const pos = pickupPos(p, i);
    const grab = ORBIT[p.kind] ? ORBIT[p.kind].grab : GRAB_DEFAULT;
    const dx = pos.x - state.worldX, dy = pos.y - (state.py - 28);
    if (dx * dx + dy * dy < grab * grab) {
      state.pickupsTaken.add(i);
      state.inventory[p.kind]++;
      const food = FOODS.find((f) => f.id === p.kind);
      addMsg(`${food.name} を拾った！`, "#9ecbff");
    }
  }

  // --- 蜂との接触 ---
  state.invulnBee = Math.max(0, state.invulnBee - dt);
  for (const b of course.bees) {
    if (Math.abs(b.x - state.worldX) > 60) continue;
    const p = beePosition(b);
    const dx = p.x - state.worldX, dy = p.y - (state.py - 28);
    if (dx * dx + dy * dy < (BEE.r + 12) ** 2 && state.invulnBee <= 0) {
      state.invulnBee = 1.2;
      state.hp -= BEE.dmg;
      state.flash = 0.8;
      addMsg(`蜂に刺された！ -${BEE.dmg}`, "#ffb060");
    }
  }

  // --- 落石（トリガー地点を越えると前方から転がってくる） ---
  for (const rf of course.rockfalls) {
    if (!state.rockfallsFired.has(rf.x) && state.worldX > rf.x) {
      state.rockfallsFired.add(rf.x);
      state.boulders.push({ x: state.worldX + 560, hit: false });
      addMsg("⚠ 落石！", "#ffd93b");
    }
  }
  for (const b of state.boulders) {
    b.x -= BOULDER.vx * dt * 60;
    if (!b.hit && Math.abs(b.x - state.worldX) < BOULDER.r + 10) {
      const clearance = groundY(state.worldX) - state.py;
      if (clearance < BOULDER.r * 2) {
        b.hit = true;
        state.hp -= BOULDER.dmg;
        state.speed = Math.max(CONF.minSpeed, state.speed * 0.4);
        state.flash = 1;
        addMsg(`落石にぶつかった！ -${BOULDER.dmg}`, "#ff7070");
      }
    }
  }
  state.boulders = state.boulders.filter((b) => b.x > state.worldX - 400);

  state.hp = Math.min(state.hpCap, state.hp);

  // --- 終了判定 ---
  if (state.hp <= 0) { state.hp = 0; state.phase = "gameover"; }
  if (state.worldX >= CONF.courseLength) {
    state.phase = "clear";
    state.resultRank = recordTime(Math.round(state.time * 10) / 10);
  }
}

// ================= 描画 =================
function wx2sx(wx) { return CONF.playerX + (wx - state.worldX); } // ワールド→画面X
function wy2sy(wy) { return wy + state.camY; }                    // ワールド→画面Y

// 標高で地面の色が変わる: 草原 → 岩場 → 雪
function lerpRGB(a, b, t) {
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
}
const COL_GRASS = [122, 158, 86], COL_ROCK = [118, 110, 102], COL_SNOW = [236, 241, 248];
const COL_TRAIL_G = [160, 118, 76], COL_TRAIL_R = [86, 80, 74], COL_TRAIL_S = [196, 208, 224];
function clamp01(v) { return Math.max(0, Math.min(1, v)); }
function groundColor(elev) {
  const t1 = clamp01((elev - 300) / 200), t2 = clamp01((elev - 800) / 200);
  const c = lerpRGB(lerpRGB(COL_GRASS, COL_ROCK, t1), COL_SNOW, t2);
  return `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
}
function trailColor(elev) {
  const t1 = clamp01((elev - 300) / 200), t2 = clamp01((elev - 800) / 200);
  const c = lerpRGB(lerpRGB(COL_TRAIL_G, COL_TRAIL_R, t1), COL_TRAIL_S, t2);
  return `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
}

function draw() {
  drawSky();
  drawBgMountains();
  drawGround();
  drawMuds();
  drawHazards();
  drawPickups();
  drawBees();
  drawBoulders();
  drawGoal();
  drawPlayer();
  drawWindStreaks();
  drawHUD();

  if (state.flash > 0) {
    ctx.fillStyle = `rgba(255,40,40,${state.flash * 0.25})`;
    ctx.fillRect(0, 0, W, H);
  }
  if (state.phase === "title") {
    drawOverlay("⛰ トレイルランニング", "スペースキーでスタート");
    drawCourseSelect();
    drawBestTimes(-1, H / 2 + 138);
  }
  if (state.phase === "gameover") drawOverlay("リタイア…", `走行距離 ${Math.round(state.worldX / 10)}m ／ R: 再挑戦 ／ T: コース選択`);
  if (state.phase === "clear") {
    const isNewRecord = state.resultRank === 0;
    drawOverlay(
      isNewRecord ? "🏆 ベストタイム更新！" : "🏁 ゴール！",
      `タイム ${formatTime(state.time)} ／ R: もう一度 ／ T: コース選択`
    );
    drawBestTimes(state.resultRank, H / 2 + 95);
  }
}

// 決定的な疑似乱数（背景の形を毎フレーム同じにするため）
function hash(n) {
  const s = Math.sin(n * 12.9898) * 43758.5453;
  return s - Math.floor(s);
}
function lerp3(a, b, c, t) {
  return t < 0.5 ? lerpRGB(a, b, t * 2) : lerpRGB(b, c, (t - 0.5) * 2);
}
function rgbaStr(c, a = 1) { return `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`; }

// 空: 標高が上がるほど深い青に。太陽は高所ほどくっきり
function drawSky() {
  const e = elevation(state.worldX);
  const t = clamp01((e - 650) / 450);
  const top = lerpRGB([121, 180, 221], [52, 106, 180], t);
  const bot = lerpRGB([217, 237, 246], [150, 196, 228], t);
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, rgbaStr(top));
  sky.addColorStop(1, rgbaStr(bot));
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);
  // 太陽
  const sunA = 0.45 + 0.45 * t;
  const g = ctx.createRadialGradient(W - 130, 88, 5, W - 130, 88, 65);
  g.addColorStop(0, `rgba(255, 250, 215, ${sunA * 0.9})`);
  g.addColorStop(1, "rgba(255, 250, 215, 0)");
  ctx.fillStyle = g;
  ctx.fillRect(W - 210, 10, 160, 160);
  ctx.fillStyle = `rgba(255, 252, 236, ${sunA})`;
  ctx.beginPath(); ctx.arc(W - 130, 88, 20, 0, Math.PI * 2); ctx.fill();
}

// 背景: 標高に応じて 樹林帯 → 岩稜帯 → 雲海と空 に移り変わる
function drawBgMountains() {
  const e = elevation(state.worldX);
  const camAdj = state.camY - (360 - BASE_Y); // ほぼ現在の標高（カメラ追従でスムーズ）
  const forestA = 1 - clamp01((e - 220) / 320);                        // 樹林帯: 低所のみ
  const rockyA  = clamp01((e - 120) / 280) * (1 - clamp01((e - 780) / 320)); // 岩稜帯: 中標高
  const alpineA = clamp01((e - 720) / 380);                            // 雲海: 高所のみ
  const t = clamp01(e / 1200);

  drawClouds(0.35 + alpineA * 0.5);

  // 遠景の山なみ（色は 樹林の緑 → 岩の灰 → 空気遠近の青白 へブレンド）
  const farCol  = lerp3([154, 186, 168], [148, 150, 160], [198, 212, 232], t);
  const nearCol = lerp3([118, 158, 134], [120, 120, 130], [176, 192, 216], t);
  drawRidge(0.15, 280 + camAdj * 0.05, 120, 700, rgbaStr(farCol));
  drawRidge(0.28, 342 + camAdj * 0.08, 90, 480, rgbaStr(nearCol));

  if (rockyA > 0.02) drawCrags(rockyA, camAdj);
  if (forestA > 0.02) {
    drawTreeline(0.4, 330 + camAdj * 0.16, 26, [74, 112, 84], forestA * 0.55);
    drawTreeline(0.55, 352 + camAdj * 0.22, 36, [50, 86, 62], forestA * 0.8);
  }
  if (alpineA > 0.02) drawCloudSea(alpineA, camAdj);
}

function drawRidge(parallax, baseY, amp, wave, color) {
  const off = state.worldX * parallax;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let sx = 0; sx <= W; sx += 20) {
    const u = (sx + off) / wave;
    const y = baseY - (Math.sin(u) * 0.6 + Math.sin(u * 2.3) * 0.4) * amp * 0.5 - amp * 0.3;
    ctx.lineTo(sx, y);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();
}

// 岩稜帯: ギザギザの岩峰のシルエット
function drawCrags(alpha, camAdj) {
  const off = state.worldX * 0.38;
  const baseY = 420 - camAdj * 0.06;
  ctx.fillStyle = `rgba(108, 104, 112, ${alpha * 0.8})`;
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let sx = 0; sx <= W; sx += 12) {
    const u = sx + off;
    const k = Math.floor(u / 110);
    const fr = (u % 110) / 110;
    const h = 60 + hash(k) * 130;
    const y = baseY - h * (1 - Math.abs(fr * 2 - 1)) - hash(k * 3.7 + Math.floor(fr * 5)) * 9;
    ctx.lineTo(sx, y);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();
}

// 樹林帯: 針葉樹のシルエットの列
function drawTreeline(parallax, baseY, size, col, alpha) {
  if (baseY > H) return;
  const off = state.worldX * parallax;
  ctx.fillStyle = rgbaStr(col, alpha);
  const step = size * 0.85;
  const start = -(off % step) - step;
  for (let sx = start; sx <= W + step; sx += step) {
    const k = Math.floor((sx + off) / step + 0.5);
    const h = size * (0.8 + hash(k) * 0.8);
    const y = baseY + hash(k * 1.31) * 12;
    ctx.beginPath();
    ctx.moveTo(sx, y);
    ctx.lineTo(sx + step * 0.45, y - h);
    ctx.lineTo(sx + step * 0.9, y);
    ctx.closePath();
    ctx.fill();
  }
}

// 高空に浮かぶ雲（ゆっくり流れる）
function drawClouds(alpha) {
  ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.55})`;
  for (let k = 0; k < 4; k++) {
    const speed = 0.1 + 0.05 * (k % 2);
    const cx = W + 200 - ((state.worldX * speed + state.time * 7 + k * 330) % (W + 400));
    const cy = 60 + hash(k * 5.1) * 150;
    const s = 0.8 + hash(k * 2.7) * 0.7;
    ctx.beginPath();
    ctx.ellipse(cx, cy, 46 * s, 13 * s, 0, 0, Math.PI * 2);
    ctx.ellipse(cx - 28 * s, cy + 4 * s, 26 * s, 10 * s, 0, 0, Math.PI * 2);
    ctx.ellipse(cx + 30 * s, cy + 5 * s, 30 * s, 10 * s, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

// 雲海: 高所で眼下の谷を埋める
function drawCloudSea(alpha, camAdj) {
  const top = 430 + camAdj * 0.04;
  const off = state.worldX * 0.22 + state.time * 5;
  ctx.fillStyle = `rgba(245, 250, 255, ${alpha * 0.9})`;
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let sx = 0; sx <= W; sx += 16) {
    const u = (sx + off) / 70;
    const y = top - (Math.sin(u) * 0.5 + Math.sin(u * 2.7 + 1.3) * 0.5) * 14 - 8;
    ctx.lineTo(sx, y);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();
  // 雲海のハイライト
  ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.5})`;
  for (let k = 0; k < 5; k++) {
    const cx = W - ((off * 1.4 + k * 240) % (W + 240)) + 120;
    ctx.beginPath();
    ctx.ellipse(cx, top + 6 + hash(k * 3.3) * 10, 60, 12, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawGround() {
  // 標高で色が変わるため、短冊状に分割して描画
  const STEP = 8;
  for (let sx = 0; sx <= W; sx += STEP) {
    const w0 = state.worldX + (sx - CONF.playerX);
    const w1 = w0 + STEP;
    const y0 = wy2sy(groundY(w0)), y1 = wy2sy(groundY(w1));
    const elev = elevation(w0 + STEP / 2);
    ctx.fillStyle = groundColor(elev);
    ctx.beginPath();
    ctx.moveTo(sx - 0.5, y0);
    ctx.lineTo(sx + STEP + 0.5, y1);
    ctx.lineTo(sx + STEP + 0.5, H);
    ctx.lineTo(sx - 0.5, H);
    ctx.closePath();
    ctx.fill();
    // トレイル（道）
    ctx.strokeStyle = trailColor(elev);
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(sx - 0.5, y0);
    ctx.lineTo(sx + STEP + 0.5, y1);
    ctx.stroke();
  }
}

function drawHazards() {
  for (let i = 0; i < course.hazards.length; i++) {
    const hz = course.hazards[i];
    const def = HAZARD[hz.type];
    const sx = wx2sx(hz.x);
    if (sx < -200 || sx > W + 200) continue;
    const gY = (wx) => wy2sy(groundY(wx));
    const gy = gY(hz.x + def.w / 2);
    if (hz.type === "rock") {
      ctx.fillStyle = "#6e6e6e";
      ctx.beginPath();
      ctx.moveTo(sx, gy + 4);
      ctx.lineTo(sx + 10, gy - 17);
      ctx.lineTo(sx + 24, gy - 23);
      ctx.lineTo(sx + 36, gy - 15);
      ctx.lineTo(sx + def.w, gy + 4);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#8a8a8a";
      ctx.beginPath();
      ctx.arc(sx + 17, gy - 8, 9, 0, Math.PI * 2);
      ctx.fill();
    } else if (hz.type === "river") {
      ctx.fillStyle = "#4a90d9";
      ctx.beginPath();
      ctx.moveTo(sx, gY(hz.x) + 2);
      ctx.quadraticCurveTo(sx + def.w / 2, gy + 30, sx + def.w, gY(hz.x + def.w) + 2);
      ctx.closePath();
      ctx.fill();
      // 波しぶき
      ctx.strokeStyle = "#bfe3ff";
      ctx.lineWidth = 2;
      for (let k = 0; k < 3; k++) {
        const wxk = sx + 20 + k * 30 + Math.sin(state.time * 4 + k) * 4;
        ctx.beginPath();
        ctx.arc(wxk, gy + 8, 6, Math.PI, 0);
        ctx.stroke();
      }
    } else if (hz.type === "cliff") {
      // 崖の割れ目
      ctx.fillStyle = "#3a3028";
      ctx.beginPath();
      ctx.moveTo(sx, gY(hz.x));
      ctx.lineTo(sx + def.w * 0.35, gy + 90);
      ctx.lineTo(sx + def.w * 0.65, gy + 90);
      ctx.lineTo(sx + def.w, gY(hz.x + def.w));
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "#241d16";
      ctx.lineWidth = 3;
      ctx.stroke();
    } else if (hz.type === "root") {
      // 木の根: 地面から飛び出したアーチ
      ctx.strokeStyle = "#6b4a2c";
      ctx.lineWidth = 5;
      ctx.lineCap = "round";
      ctx.beginPath(); ctx.arc(sx + 8, gy + 2, 9, Math.PI, 0); ctx.stroke();
      ctx.beginPath(); ctx.arc(sx + 19, gy + 2, 7, Math.PI, 0); ctx.stroke();
    }
    // 注意サイン（未通過のみ）
    if (!state.hazardsHit.has(i) && hz.x > state.worldX) {
      ctx.fillStyle = "rgba(255, 220, 60, 0.9)";
      ctx.font = "bold 14px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("⚠", sx + def.w / 2, gy - 46);
    }
  }
}

function drawPickups() {
  for (let i = 0; i < course.pickups.length; i++) {
    if (state.pickupsTaken.has(i)) continue;
    const p = course.pickups[i];
    if (wx2sx(p.x) < -130 || wx2sx(p.x) > W + 130) continue;
    const o = ORBIT[p.kind];
    if (o) {
      // 円軌道をうっすら点線で表示
      ctx.strokeStyle = "rgba(255, 255, 255, 0.3)";
      ctx.setLineDash([4, 6]);
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(wx2sx(p.x), wy2sy(groundY(p.x) - o.cy), o.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    const pos = pickupPos(p, i);
    const sx = wx2sx(pos.x), sy = wy2sy(pos.y);
    // 光る背景
    ctx.fillStyle = "rgba(255,255,255,0.35)";
    ctx.beginPath();
    ctx.arc(sx, sy, 18, 0, Math.PI * 2);
    ctx.fill();
    drawItemIcon(p.kind, sx, sy, 1.0);
  }
}

function drawItemIcon(kind, x, y, s) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  if (kind === "candy") {
    // 飴: ピンクの玉 + 包み
    ctx.fillStyle = "#ff6fa0";
    ctx.beginPath(); ctx.ellipse(0, 0, 8, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffb6cf";
    ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(-14, -5); ctx.lineTo(-14, 5); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(14, -5); ctx.lineTo(14, 5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.6)";
    ctx.beginPath(); ctx.arc(-2.5, -2.5, 2.2, 0, Math.PI * 2); ctx.fill();
  } else if (kind === "banana") {
    ctx.strokeStyle = "#ffd93b";
    ctx.lineWidth = 6;
    ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(0, -3, 9, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
    ctx.fillStyle = "#8a6a20";
    ctx.fillRect(7, -7, 3, 4);
  } else if (kind === "drink") {
    // ドリンクボトル
    ctx.fillStyle = "#4fc3f7";
    roundRect(-6, -6, 12, 15, 3); ctx.fill();
    ctx.fillStyle = "#1c7ab0";
    ctx.fillRect(-4, -11, 8, 5);
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    ctx.fillRect(-4, -3, 3, 9);
  } else if (kind === "onigiri") {
    ctx.fillStyle = "#f8f8f4";
    ctx.beginPath();
    ctx.moveTo(0, -10);
    ctx.quadraticCurveTo(11, -10, 10, 3);
    ctx.quadraticCurveTo(9, 9, 0, 9);
    ctx.quadraticCurveTo(-9, 9, -10, 3);
    ctx.quadraticCurveTo(-11, -10, 0, -10);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#2a2f2a";
    ctx.fillRect(-4, 2, 8, 7);
  }
  ctx.restore();
}

// 泥道: トレイルの上に濃い泥を重ねる
function drawMuds() {
  for (const z of course.muds) {
    const sx0 = wx2sx(z.x), sx1 = wx2sx(z.x + z.w);
    if (sx1 < -60 || sx0 > W + 60) continue;
    ctx.strokeStyle = "#5a4632";
    ctx.lineWidth = 10;
    ctx.beginPath();
    for (let sx = sx0; sx <= sx1; sx += 6) {
      const y = wy2sy(groundY(state.worldX + (sx - CONF.playerX)));
      sx === sx0 ? ctx.moveTo(sx, y) : ctx.lineTo(sx, y);
    }
    ctx.stroke();
    // 泡
    ctx.fillStyle = "#6e563c";
    for (let k = 0; k < 4; k++) {
      const bx = sx0 + ((k * 41 + state.time * 22) % Math.max(1, sx1 - sx0));
      const y = wy2sy(groundY(state.worldX + (bx - CONF.playerX)));
      ctx.beginPath(); ctx.arc(bx, y - 3, 2.5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = "#8a6a48";
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("泥", (sx0 + sx1) / 2, wy2sy(groundY(z.x + z.w / 2)) + 20);
  }
  ctx.textAlign = "left";
}

// 蜂
function drawBees() {
  for (const b of course.bees) {
    const sx = wx2sx(b.x);
    if (sx < -40 || sx > W + 40) continue;
    const sy = wy2sy(beePosition(b).y);
    ctx.save();
    ctx.translate(sx, sy);
    // 羽（高速で羽ばたく）
    const flap = Math.sin(state.time * 40);
    ctx.fillStyle = "rgba(220, 235, 255, 0.8)";
    ctx.beginPath(); ctx.ellipse(-2, -8, 6, 3 + flap * 2, -0.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(4, -8, 6, 3 - flap * 2, 0.5, 0, Math.PI * 2); ctx.fill();
    // 体（黄黒の縞）
    ctx.fillStyle = "#ffce33";
    ctx.beginPath(); ctx.ellipse(0, 0, 10, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#3a2e18";
    ctx.fillRect(-4, -6.5, 3, 13);
    ctx.fillRect(2, -6, 3, 12);
    // 針と目
    ctx.strokeStyle = "#3a2e18";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(-14, 2); ctx.stroke();
    ctx.fillStyle = "#000";
    ctx.beginPath(); ctx.arc(7.5, -2, 1.6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

// 転がってくる落石
function drawBoulders() {
  for (const b of state.boulders) {
    const sx = wx2sx(b.x);
    if (sx < -60 || sx > W + 60) continue;
    const sy = wy2sy(groundY(b.x)) - BOULDER.r + 2;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(state.time * 7 % (Math.PI * 2));
    ctx.fillStyle = "#7c7168";
    ctx.beginPath(); ctx.arc(0, 0, BOULDER.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#5d544c";
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-BOULDER.r + 4, 0); ctx.lineTo(BOULDER.r - 4, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -BOULDER.r + 4); ctx.lineTo(0, BOULDER.r - 4); ctx.stroke();
    ctx.restore();
  }
}

// 強風の突風エフェクト
function drawWindStreaks() {
  if (state.phase === "run" && !inWindGust()) return;
  if (state.phase !== "run") return;
  ctx.strokeStyle = "rgba(255, 255, 255, 0.45)";
  ctx.lineWidth = 2;
  ctx.lineCap = "round";
  for (let k = 0; k < 10; k++) {
    const y = 50 + (k * 53) % (H - 120) + Math.sin(state.time * 3 + k) * 10;
    const x = W - ((state.time * 900 + k * 217) % (W + 200)) + 100;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 70, y + 4); ctx.stroke();
  }
  ctx.fillStyle = "#dcefff";
  ctx.font = "bold 14px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("🌬 強風！", CONF.playerX, wy2sy(state.py) - 95);
  ctx.textAlign = "left";
}

function drawGoal() {
  const sx = wx2sx(CONF.courseLength);
  if (sx < -100 || sx > W + 100) return;
  const gy = wy2sy(groundY(CONF.courseLength));
  ctx.fillStyle = "#333";
  ctx.fillRect(sx, gy - 90, 4, 90);
  ctx.fillStyle = "#e33";
  ctx.beginPath();
  ctx.moveTo(sx + 4, gy - 90);
  ctx.lineTo(sx + 60, gy - 78);
  ctx.lineTo(sx + 4, gy - 66);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.font = "bold 13px sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("GOAL", sx + 10, gy - 74);
}

function drawPlayer() {
  const x = CONF.playerX, footY = wy2sy(state.py);
  const slope = slopeAt(state.worldX);
  const lean = state.onGround ? Math.atan(-slope) * 0.5 : 0.15;

  ctx.save();
  ctx.translate(x, footY);
  ctx.rotate(lean);

  const run = state.onGround ? Math.sin(state.legPhase) : 0.7;
  const run2 = state.onGround ? Math.sin(state.legPhase + Math.PI) : -0.4;

  ctx.strokeStyle = "#2b3547";
  ctx.lineWidth = 4;
  ctx.lineCap = "round";
  // 脚
  ctx.beginPath(); ctx.moveTo(0, -26); ctx.lineTo(8 * run, -13 + Math.abs(run) * 2); ctx.lineTo(10 * run, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -26); ctx.lineTo(8 * run2, -13 + Math.abs(run2) * 2); ctx.lineTo(10 * run2, 0); ctx.stroke();
  // 胴体
  ctx.strokeStyle = "#e05a3a";
  ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(0, -26); ctx.lineTo(4, -46); ctx.stroke();
  // リュック（背中側）
  const bob = state.onGround ? Math.abs(Math.sin(state.legPhase)) * 1.5 : 0; // 走りに合わせて揺れる
  ctx.fillStyle = "#2e8b57";
  roundRect(-11, -47 + bob, 10, 18, 4);
  ctx.fill();
  ctx.fillStyle = "#246e45";
  roundRect(-11, -38 + bob, 10, 6, 2); // 下部ポケット
  ctx.fill();
  ctx.fillStyle = "#ffd93b";
  roundRect(-9, -45 + bob, 6, 3, 1.5); // 雨蓋のバックル
  ctx.fill();
  // ショルダーストラップ
  ctx.strokeStyle = "#246e45";
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-2, -45 + bob * 0.5); ctx.lineTo(5, -40); ctx.stroke();
  // 腕
  ctx.strokeStyle = "#e05a3a";
  ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.moveTo(3, -43); ctx.lineTo(3 + 9 * run2, -36); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(3, -43); ctx.lineTo(3 + 9 * run, -36); ctx.stroke();
  // 頭
  ctx.fillStyle = "#f2c9a0";
  ctx.beginPath(); ctx.arc(6, -54, 7, 0, Math.PI * 2); ctx.fill();
  // キャップ
  ctx.fillStyle = "#2e7dd1";
  ctx.beginPath(); ctx.arc(6, -56, 7, Math.PI, 0); ctx.fill();
  ctx.fillRect(6, -57, 10, 3);

  ctx.restore();
}

// ================= HUD =================
function drawHUD() {
  // --- 左上: 持ち物（補給食一覧） ---
  ctx.save();
  ctx.fillStyle = "rgba(20, 28, 42, 0.78)";
  roundRect(10, 10, 258, 74, 8);
  ctx.fill();
  ctx.fillStyle = "#cfe0f5";
  ctx.font = "bold 12px sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("持ち物（←→選択 / Eで補給）", 20, 28);
  for (let i = 0; i < FOODS.length; i++) {
    const f = FOODS[i];
    const bx = 20 + i * 62, by = 38;
    if (i === state.selected) {
      ctx.fillStyle = "rgba(255, 230, 120, 0.25)";
      roundRect(bx - 4, by - 2, 58, 40, 6);
      ctx.fill();
      ctx.strokeStyle = "#ffd93b";
      ctx.lineWidth = 2;
      roundRect(bx - 4, by - 2, 58, 40, 6);
      ctx.stroke();
    }
    drawItemIcon(f.id, bx + 11, by + 12, 0.8);
    ctx.fillStyle = state.inventory[f.id] > 0 ? "#ffffff" : "#7a8699";
    ctx.font = "bold 13px sans-serif";
    ctx.fillText("×" + state.inventory[f.id], bx + 27, by + 17);
    ctx.fillStyle = "#9fb0c8";
    ctx.font = "10px sans-serif";
    ctx.fillText(f.name, bx + 2, by + 34);
  }
  ctx.restore();

  // --- 右上: 体力ゲージ・スピードゲージ ---
  const gx = W - 290, gw = 270;
  ctx.fillStyle = "rgba(20, 28, 42, 0.78)";
  roundRect(gx - 10, 10, gw + 20, 86, 8);
  ctx.fill();

  // 体力
  ctx.fillStyle = "#cfe0f5";
  ctx.font = "bold 12px sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("体力", gx, 30);
  drawBar(gx + 46, 20, gw - 46, 14, state.hp / CONF.hpMax, hpColor(), state.hpCap / CONF.hpMax);
  // スピード
  ctx.fillStyle = "#cfe0f5";
  ctx.font = "bold 12px sans-serif";
  ctx.fillText("スピード", gx, 56);
  const maxSp = effectiveMaxSpeed();
  drawBar(gx + 60, 46, gw - 60, 14, state.speed / CONF.maxSpeed, "#4fc3f7", maxSp / CONF.maxSpeed);

  // 地形表示 + 距離
  const slope = slopeAt(state.worldX);
  let terrain = "平地";
  if (slope > 0.01) terrain = "上り坂 ↗（体力消費 大）";
  else if (slope < -0.01) terrain = "下り坂 ↘（体力消費 小）";
  ctx.fillStyle = "#9fb0c8";
  ctx.font = "12px sans-serif";
  ctx.fillText(`${terrain}`, gx, 80);
  ctx.textAlign = "right";
  ctx.fillText(`${Math.round(state.worldX / 10)} / ${CONF.courseLength / 10} m`, gx + gw, 80);
  ctx.textAlign = "left";

  // --- タイム（画面上部中央） ---
  ctx.fillStyle = "rgba(20, 28, 42, 0.78)";
  roundRect(W / 2 - 70, 10, 140, 34, 8);
  ctx.fill();
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 20px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("⏱ " + formatTime(state.time), W / 2, 34);
  if (bestTimes.length > 0) {
    ctx.fillStyle = "#9fb0c8";
    ctx.font = "11px sans-serif";
    ctx.fillText("ベスト " + formatTime(bestTimes[0]), W / 2, 56);
  }
  ctx.textAlign = "left";

  // --- 進行バー（画面下部） ---
  const pbY = H - 16;
  ctx.fillStyle = "rgba(20,28,42,0.6)";
  roundRect(20, pbY, W - 40, 8, 4);
  ctx.fill();
  ctx.fillStyle = "#ffd93b";
  roundRect(20, pbY, (W - 40) * Math.min(1, state.worldX / CONF.courseLength), 8, 4);
  ctx.fill();

  // --- メッセージ ---
  ctx.font = "bold 15px sans-serif";
  ctx.textAlign = "center";
  state.messages.forEach((m, i) => {
    ctx.globalAlpha = Math.min(1, m.timer);
    ctx.fillStyle = m.color;
    ctx.fillText(m.text, W / 2, 130 + i * 24);
  });
  ctx.globalAlpha = 1;

  // オーバーペース・疲労警告
  if (state.phase === "run") {
    ctx.font = "bold 13px sans-serif";
    ctx.textAlign = "center";
    if ((state.lastDrain || 0) > 5) {
      ctx.fillStyle = "#ff6060";
      ctx.fillText("⚠ オーバーペース！ 体力が急激に減っている", W / 2, 108);
    } else if (state.hp < CONF.tiredThreshold) {
      ctx.fillStyle = state.hp < CONF.capDropBelow ? "#ff8080" : "#ffcf6b";
      const warn = state.hp < CONF.capDropBelow
        ? "限界が近い！ 疲労で回復上限が下がっていく…"
        : "疲れてきた… 最大スピードが落ちている";
      ctx.fillText(warn, W / 2, 108);
    }
  }
  ctx.textAlign = "left";
}

function hpColor() {
  if (state.hp > 60) return "#5ecf6a";
  if (state.hp > 30) return "#ffd93b";
  return "#ff6060";
}

// value: 0-1, cap: 0-1（capから右は使用不可ゾーンとして暗く表示）
function drawBar(x, y, w, h, value, color, cap = 1) {
  ctx.fillStyle = "#2c3a50";
  roundRect(x, y, w, h, 5);
  ctx.fill();
  if (cap < 1) {
    ctx.fillStyle = "rgba(120, 60, 60, 0.85)";
    roundRect(x + w * cap, y, w * (1 - cap), h, 5);
    ctx.fill();
  }
  ctx.fillStyle = color;
  if (value > 0.005) {
    roundRect(x, y, Math.max(4, w * Math.min(value, 1)), h, 5);
    ctx.fill();
  }
  ctx.strokeStyle = "rgba(255,255,255,0.25)";
  ctx.lineWidth = 1;
  roundRect(x, y, w, h, 5);
  ctx.stroke();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ベスト5の一覧を表示（highlightRank: 今回の記録の順位をハイライト、-1でなし）
function drawBestTimes(highlightRank, by = H / 2 + 95) {
  if (bestTimes.length === 0) return;
  const bx = W / 2;
  ctx.textAlign = "center";
  ctx.fillStyle = "#ffd93b";
  ctx.font = "bold 15px sans-serif";
  ctx.fillText("— ベスト5 —", bx, by);
  ctx.font = "14px sans-serif";
  for (let i = 0; i < bestTimes.length; i++) {
    const isNew = i === highlightRank;
    ctx.fillStyle = isNew ? "#ffd93b" : "#cfe0f5";
    ctx.font = isNew ? "bold 15px sans-serif" : "14px sans-serif";
    ctx.fillText(
      `${i + 1}位  ${formatTime(bestTimes[i])}${isNew ? "  ← 今回！" : ""}`,
      bx, by + 22 + i * 21
    );
  }
  ctx.textAlign = "left";
}

function drawOverlay(title, sub) {
  ctx.fillStyle = "rgba(15, 22, 35, 0.72)";
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 40px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(title, W / 2, H / 2 - 20);
  ctx.font = "18px sans-serif";
  ctx.fillStyle = "#cfe0f5";
  ctx.fillText(sub, W / 2, H / 2 + 24);
  ctx.textAlign = "left";
}

// タイトル画面のコース選択UI
function drawCourseSelect() {
  ctx.textAlign = "center";
  ctx.font = "bold 18px sans-serif";
  ctx.fillStyle = "#ffd93b";
  ctx.fillText(`◀  コース${courseIdx + 1}「${course.name}」 ▶`, W / 2, H / 2 + 62);
  ctx.font = "13px sans-serif";
  ctx.fillStyle = "#cfe0f5";
  ctx.fillText(course.intro, W / 2, H / 2 + 86);
  ctx.font = "12px sans-serif";
  ctx.fillStyle = "#9fb0c8";
  ctx.fillText("← → でコース選択（1〜5キーでも可）", W / 2, H / 2 + 108);
  ctx.textAlign = "left";
}

// ================= メインループ =================
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
